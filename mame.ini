#
# NETPLAY: keep MAME's WRITABLE output out of the repo root.
#
# The working directory stays the repo root on purpose. Every READ path
# below is a bare CWD-relative name pointing at repo content - hash,
# artwork, plugins, language, bgfx, ctrlr, cheat, samples, ini - so moving
# the working directory breaks all of them, silently. Only the writable
# directories are redirected, which cannot break anything: if a setting
# does not take effect the file simply lands where it used to.
#
# run/ is gitignored by upstream's deny-all rule. See notes/build-config.txt.
#
cfg_directory             run\cfg
nvram_directory           run\nvram
input_directory           run\inp
state_directory           run\sta
snapshot_directory        run\snap
diff_directory            run\diff
comment_directory         run\comments
